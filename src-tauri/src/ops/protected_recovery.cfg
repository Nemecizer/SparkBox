# SparkBox: carry the vendor's normal-boot initcall blacklist into recovery.
# Keep the vendor package file unchanged. Review with future kernel updates.
sb_recovery_initcalls() (
    set -f
    sb_recovery="${GRUB_CMDLINE_LINUX_RECOVERY:-}"
    for sb_arg in ${GRUB_CMDLINE_LINUX_DEFAULT:-}; do
        case "$sb_arg" in
            initcall_blacklist=*)
                if [ -z "$sb_recovery" ]; then
                    if [ -x /lib/recovery-mode/recovery-menu ]; then
                        sb_recovery=recovery
                    else
                        sb_recovery=single
                    fi
                fi
                case " $sb_recovery " in
                    *" $sb_arg "*) ;;
                    *) sb_recovery="$sb_recovery $sb_arg" ;;
                esac ;;
        esac
    done
    printf '%s' "$sb_recovery"
)
GRUB_CMDLINE_LINUX_RECOVERY="$(sb_recovery_initcalls)"
unset -f sb_recovery_initcalls
